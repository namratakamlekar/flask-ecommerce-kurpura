{# One product card. Used on Home now, Shop later. #}
{% macro product_card(p) %}
<article class="card">
  <a href="{{ url_for('product', id=p.id) }}" class="card-media cat-{{ p.css_index }}" aria-label="View {{ p.name }}">
    <img class="card-img" src="{{ url_for('static', filename='img/products/' ~ p.image) }}" alt="{{ p.name }}" loading="lazy">
    {% if p.tag %}<span class="badge">{{ p.tag }}</span>{% endif %}
  </a>
  <div class="card-body">
    <p class="card-cat">{{ p.category }}</p>
    <h3 class="card-title"><a href="{{ url_for('product', id=p.id) }}">{{ p.name }}</a></h3>
    <p class="card-hi">{{ p.name_hi }} &middot; {{ p.size }}</p>
    <div class="price-row"><span class="price">{{ p.price | rupees }}</span><span class="mrp">{{ p.mrp | rupees }}</span><span class="off">{{ p.discount }}% off</span></div>
    <button class="btn btn-primary" data-add="{{ p.id }}">Add to cart</button>
  </div>
</article>
{% endmacro %}
