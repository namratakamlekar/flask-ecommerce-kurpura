{% extends "base.html" %}
{% block title %}Login | Śivārpaṇa Karpura{% endblock %}
{% block css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">{% endblock %}

{% block content %}
<main class="auth"><div class="panel">
  <h1>Welcome back</h1>
  <p class="sub">Log in to see your orders and check out faster.</p>
  {% if error %}<div class="msg err">{{ error }}</div>{% endif %}
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password"></div>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>
  <p class="alt">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></main>
{% endblock %}
